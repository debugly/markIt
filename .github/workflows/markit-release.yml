name: markit-release
# macOS 和 Android 用同一个 job，跑在 macOS runner 上：
#
# - Android 本来就需要 macOS 或 Linux runner；
# - macOS 端必须用 macOS；
# - 共用一次 checkout，产物落在同一个工作目录里，不用通过 artifact 来回搬。
#
# 两个平台共用一个版本号，也就共用一个 release。版本号的真相来源是 tag，
# 不是 project.yml / build.gradle.kts 里手写的值 —— 那两处很容易漂移，
# 真正发布时按 tag 打进去。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 版本号，如 0.4.0 或 0.5.0-beta.1（留空则用当前分支名）
        required: false
      beta:
        type: boolean
        description: 这是预发布版本（tag 必须带预发布后缀）
        default: false
        required: false

jobs:
  build:
    name: build-and-publish
    runs-on: macos-15  # Android and macOS both build here
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # 全历史 + tag：release 说明里的 Changelog 按上一个正式版 tag 生成
        # compare 链接，默认的浅克隆拿不到 tag。
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # macOS 镜像自带 Android SDK，但只有一份 platform 工具；compileSdk 36 要
    # 自己装，命令行工具也得显式更新，否则 sdkmanager 可能找不到。
    - name: Install Android SDK packages
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
        test -d "$SDK" || { echo "::error::no Android SDK at $SDK"; exit 1; }
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

        # $GITHUB_PATH only takes effect in *later* steps, so the path has to be
        # exported here as well or sdkmanager is simply not found.
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$SDKMANAGER" ]]; then
          echo "::error::no sdkmanager at $SDKMANAGER -- this runner image has no command-line tools" >&2
          exit 1
        fi

        "$SDKMANAGER" --version
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        "$SDKMANAGER" --list_installed | head -20 || true

    - name: Install xcodegen
      run: brew install xcodegen

    # 版本号在编译前就算出来，但不烧进构建：mac 端通过 MARKIT_VERSION 传给
    # build.sh（只影响 CURRENT_PROJECT_VERSION，也就是 build 号），Android 端
    # 在编译后重命名产物。晚定的好处是 beta 序号取的是发布那一刻的现状。
    - name: Resolve Version
      run: |
        set -euo pipefail
        .github/scripts/resolve-version.sh "${{ inputs.tag }}" "${{ inputs.beta && '1' || '0' }}"

    # ---- macOS ----
    #
    # 用仓库里的 build.sh，和本地开发走同一条路径。它默认会 rsync 到
    # /Applications 并 open，那两件事在 runner 上都没意义（没有 GUI 会话），
    # 所以用环境变量关掉，让产物留在工作目录里。
    #
    # dSYM 一起导出：崩溃栈只有配上 dSYM 才能还原成源码行号，事后补不出来。
    - name: Build macOS App
      run: |
        set -euo pipefail
        set -a; source release-constants.env; set +a
        # build 号取构建当天的 MMdd，和本地 build.sh 的默认值一致：它只需要
        # 每次构建变大，不需要和版本号有对应关系。
        BUILD_NUMBER="$(date +%m%d)"
        MARKIT_DEST="$PWD/dist" \
        MARKIT_OPEN=0 \
        MARKIT_KEEP_DSYM=1 \
        MARKIT_BUILD="$BUILD_NUMBER" \
          ./build.sh
        ls -la dist

    # zip 里只有 app。dSYM 单独走 artifact：它只在分析崩溃时有用，而那种时候要
    # 的是日志旁边的那一份符号表，不是让用户从下载列表里翻一个包。塞进 zip
    # 会白白多占几 MB，还让人以为解压出来的东西该往「应用程序」里拖。
    - name: Package macOS Zip
      run: |
        set -euo pipefail
        set -a; source release-constants.env; set +a
        cd dist
        # 不用 -y：它只对符号链接有意义，而这里存的必须是解引用后的真实文件，
        # 换成跨机器解压时的链接会在 app 内部断掉。
        zip -rq "MarkIt-${VERSION}.zip" Markit.app
        ls -l

    # dSYM 单独打一个 zip，作为 release 的第三个资产上传。
    #
    # 它要能按版本取到：崩溃日志里只有 UUID 和加载地址，要还原成源码行号
    # 必须配对「那个构建」的 dSYM。所以文件名带版本号，和 app 放在同一个 release
    # 里，排查崩溃的人一眼就知道该下哪一个。
    #
    # 但不放进 app 那个 zip：绝大多数用户只是拖进「应用程序」，不解压也不
    # 该看见符号表，白占好几 MB。
    - name: Package dSYM
      run: |
        set -euo pipefail
        set -a; source release-constants.env; set +a
        mkdir -p debug-symbols
        DSYM="$(find build -maxdepth 1 -name '*.dSYM' | head -1)"
        if [[ -z "$DSYM" ]]; then
          echo "::error::no dSYM in build/ -- MARKIT_KEEP_DSYM may not have run" >&2
          exit 1
        fi
        mv "$DSYM" debug-symbols/
        # 明确写出 dist/ 而不是用 ../：subshell 里换工作目录之后，相对路径的
        # 基准变了，写 ../ 会把 zip 落在仓库根目录，然后下一步找不到它。
        (cd debug-symbols && zip -rq "$GITHUB_WORKSPACE/dist/MarkIt-${VERSION}-dSYM.zip" ./*.dSYM)
        echo "dSYM for crash analysis: MarkIt-${VERSION}-dSYM.zip"
        ls -l

    # 确认它没有混进 app 的 zip：用户那份只能是 app 一个目录。
    - name: Verify user archive holds only the app
      run: |
        set -euo pipefail
        set -a; source release-constants.env; set +a
        TOP="$(unzip -Z1 "dist/MarkIt-${VERSION}.zip" | cut -d/ -f1 | sort -u)"
        echo "top level: $TOP"
        test "$TOP" = "Markit.app" || {
          echo "::error::user zip should contain only Markit.app, found: $TOP" >&2
          exit 1; }

    # ---- Android ----
    #
    # debug 签名：没有 release keystore 的话没法出正式签名包，而 debug 包
    # 已经能装、能用全功能。要正式签名的话把 keystore 存成 repository secret，
    # 这里换成 release 构型即可。
    - name: Build Android APK
      run: |
        set -euo pipefail
        chmod +x android/gradlew
        cd android
        ./gradlew :app:assembleRelease --no-daemon --stacktrace \
          || {
            echo "::error::release build failed; falling back to the debug APK so the release still ships something installable"
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          }

    - name: Collect Android APK
      run: |
        set -euo pipefail
        set -a; source release-constants.env; set +a
        APK="$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 \
               || ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
        test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
        echo "using $APK"
        cp "$APK" "dist/MarkIt-${VERSION}.apk"
        ls -l dist

    - name: Generate Release Notes
      run: |
        set -euo pipefail
        .github/scripts/generate-release-notes.sh release-constants.env release-notes.md

    # 同名 tag 已存在就直接失败，这是故意的：覆盖掉别人刚发的产物属于不可逆
    # 的事故。想要新版本就换一个 tag 重新 dispatch。
    - name: Publish Release
      run: |
        set -euo pipefail
        set -a; source release-constants.env; set +a

        shopt -s nullglob
        # The dSYM rides along as its own asset: wanted when reading a crash
        # log, unwanted when just installing the app.
        ASSETS=(dist/MarkIt-${VERSION}.zip dist/MarkIt-${VERSION}.apk dist/MarkIt-${VERSION}-dSYM.zip)
        shopt -u nullglob
        test "${#ASSETS[@]}" -eq 3 || { echo "::error::expected 3 assets, got ${#ASSETS[@]}"; exit 1; }

        echo "::notice::发布 ${TAG}：${#ASSETS[@]} 个资产"

        # bash 3.2, which is what ships on the macOS runners, treats an empty
        # array under `set -u` as an unbound variable -- so "${FLAGS[@]}" on a
        # zero-length array aborts the step. An empty string expands to nothing
        # at all, which is what a stable release wants to pass.
        PRERELEASE_FLAG=""
        if [[ "$IS_BETA" == "1" ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi

        gh release create "$TAG" --target "$GITHUB_REF_NAME" \
          --title "MarkIt ${TAG}" --notes-file release-notes.md \
          $PRERELEASE_FLAG "${ASSETS[@]}"

    # artifact 供 CI 自查和崩溃分析（run 页面底部，需要登录 GitHub 才能下载）。
    # dSYM 单独一份，不会混进 dist/。
    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: markit-release
        path: dist/
        retention-days: 30

    - name: Upload dSYM
      uses: actions/upload-artifact@v4
      with:
        name: markit-dsym
        path: debug-symbols/
        retention-days: 90
