name: Markit
options:
  bundleIdPrefix: com.debugly
  deploymentTarget:
    macOS: "11.0"
  xcodeVersion: "15.0"

targets:
  Markit:
    type: application
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/MarkItApp
        name: Sources
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Markit
        PRODUCT_BUNDLE_IDENTIFIER: com.debugly.markit
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "0903"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: "NO"
        ASSETCATALOG_COMPILER_GENERATE_OBJC_ASSET_SYMBOLS: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic

schemes:
  Markit:
    build:
      targets:
        Markit: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
