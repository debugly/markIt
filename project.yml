name: Markit
options:
  bundleIdPrefix: com.debugly
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"

targets:
  Markit:
    type: application
    platform: macOS
    sources:
      - path: Sources/MarkItApp
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Markit
        PRODUCT_BUNDLE_IDENTIFIER: com.debugly.markit
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "0715"
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Markit:
    build:
      targets:
        Markit: all
    run:
      config: Debug
